# Run: dart run flutter_native_splash:create
# The OS selects the dark variant before Flutter has restored the saved
# in-app theme preference.
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/branding/splash_light_mode.png"
  color_dark: "#0E1B3D"
  image_dark: "assets/branding/splash_dark_mode.png"
  branding: "assets/branding/wordmark_light.png"
  branding_dark: "assets/branding/wordmark_dark.png"
  # Keeps the wordmark clear of the iOS home indicator / Android nav bar.
  branding_bottom_padding: 48
  android_12:
    color: "#FFFFFF"
    image: "android/app/src/main/res/drawable-xxxhdpi/android12splash.png"
    color_dark: "#0E1B3D"
    image_dark: "android/app/src/main/res/drawable-night-xxxhdpi/android12splash.png"
  web: true
