name: school_pulse
description: "A school management platform for Uganda."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  cloud_functions: ^5.2.2
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.2.2
  firebase_analytics: ^11.3.8
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  dartz: ^0.10.1
  get_it: ^8.0.3
  provider: ^6.1.2
  internet_connection_checker: ^1.0.0+1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
