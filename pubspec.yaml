name: school_pulse
description: "A school management platform for Uganda."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  flutter_native_splash: ^2.4.3
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  cloud_functions: ^5.2.2
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.2.2
  firebase_analytics: ^11.3.8
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  dartz: ^0.10.1
  get_it: ^8.0.3
  provider: ^6.1.2
  internet_connection_checker: ^1.0.0+1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  flutter_colorpicker: ^1.1.0
  lottie: ^3.1.2
  uuid: ^4.5.1
  syncfusion_flutter_xlsio: ^28.1.33
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  blue_thermal_printer: ^1.2.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  rxdart: ^0.28.0
  http: ^1.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  nfc_manager: ^3.5.0
  file_picker: ^11.0.3
  record: ^7.1.1
  just_audio: ^0.10.6
  geolocator: ^14.0.2
  package_info_plus: ^8.1.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  firebase_app_check: ^0.3.2+10
  firebase_crashlytics: ^4.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  fake_cloud_firestore: ^3.1.0
  flutter_launcher_icons: ^0.14.0
  firebase_core_platform_interface: ^6.0.0

dependency_overrides:
  analyzer: 5.13.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/branding/
    - assets/branding/2.0x/
    - assets/branding/3.0x/
    - assets/branding/states/
    - assets/branding/loading/light/
    - assets/branding/loading/dark/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 800
