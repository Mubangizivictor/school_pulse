# Reference only - do NOT run `dart run flutter_launcher_icons`. The launcher
# icons are committed as the finished Roof beat brand-pack files, and the
# generator is not equivalent: it re-renders every iOS/web icon, re-adds the
# unused iOS 50/57/72 px sizes, writes a second values/colors.xml that
# duplicates ic_launcher_background (build error), and wraps the adaptive
# layers in a 16% inset that shrinks the icon. If the masters change, replace
# the files from the brand pack instead.
flutter_launcher_icons:
  image_path: "assets/branding/launcher_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1F4FD1"
  adaptive_icon_foreground: "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png"
  web:
    generate: true
    image_path: "web/icons/Icon-512.png"
    background_color: "#0E1B3D"
    theme_color: "#1F4FD1"
