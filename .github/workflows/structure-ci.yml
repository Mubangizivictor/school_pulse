name: Structure CI

on:
  pull_request:
    paths:
      - 'lib/features/structure/**'
      - 'test/features/structure/**'
      - '.github/workflows/structure-ci.yml'
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Normalize Structure formatting for CI
        run: dart format lib/features/structure test/features/structure
      - name: Analyze Structure rebuild
        run: flutter analyze lib/features/structure test/features/structure
      - name: Run Structure tests
        run: flutter test test/features/structure
