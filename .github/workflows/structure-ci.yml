name: Structure CI

on:
  pull_request:
    paths:
      - 'lib/features/structure/**'
      - 'test/features/structure/**'
      - 'firestore.rules'
      - '.github/workflows/structure-ci.yml'
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Normalize Structure formatting for CI
        run: dart format lib/features/structure test/features/structure
      - name: Analyze Structure rebuild
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/structure test/features/structure
      - name: Verify Structure Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'match /structure_setup_preferences/{schoolId}' firestore.rules
          for collection in \
            structure_curriculum_assignments \
            structure_teaching_assignments \
            structure_teaching_plans \
            structure_teaching_plan_subjects \
            structure_class_plan_overrides; do
            grep -q "match /${collection}/{id}" firestore.rules
          done
          grep -q 'request.resource.data.schoolId == schoolId' firestore.rules
          immutable_count=$(grep -c 'request.resource.data.schoolId == resource.data.schoolId' firestore.rules)
          test "$immutable_count" -ge 4
          grep -q 'isSameSchool(request.resource.data.schoolId)' firestore.rules
          grep -q 'isSameSchool(resource.data.schoolId)' firestore.rules
      - name: Run Structure tests
        run: flutter test test/features/structure
