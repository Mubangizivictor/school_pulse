name: Health / Clinic CI

on:
  pull_request:
    paths:
      - 'lib/features/health/**'
      - 'lib/features/nurse/**'
      - 'test/features/health/**'
      - 'test/features/nurse/**'
      - 'functions/health_clinic.js'
      - 'functions/test/health_clinic.emulator.test.cjs'
      - 'functions/test/storage.rules.test.cjs'
      - 'storage.rules'
      - '.github/workflows/health-ci.yml'
  workflow_dispatch:

jobs:
  flutter:
    name: Analyze + Flutter tests (Nurse / Health)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Normalize Nurse / Health formatting for CI
        run: dart format lib/features/health lib/features/nurse test/features/health test/features/nurse
      - name: Analyze Nurse / Health
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/health lib/features/nurse test/features/health test/features/nurse
      - name: Run Nurse / Health Flutter tests
        run: flutter test test/features/health test/features/nurse test/features/institution_health test/features/structure/structure_health_resolver_test.dart

  emulator:
    name: Firestore + Storage emulator (clinic mutations, storage rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Clinic mutations emulator suite
        working-directory: functions
        run: npm run test:health-clinic:emulator
      - name: Storage rules emulator suite
        working-directory: functions
        run: npm run test:storage-rules
