name: Structure Rules Hardening Once

on:
  push:
    branches:
      - feat/structure-sequential-rebuild-2026-08-17
    paths:
      - '.github/workflows/structure-rules-hardening-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structure-sequential-rebuild-2026-08-17
      - name: Harden Structure tenant rules
        shell: python
        run: |
          from pathlib import Path

          path = Path('firestore.rules')
          text = path.read_text()
          start_marker = '    match /structure_setup_preferences/{id} {'
          end_marker = '\n\n    match /houses/{id} {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Could not locate the Structure runtime rules block exactly once')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          hardened = '''    match /structure_setup_preferences/{schoolId} {
            allow read, delete: if isStaff() && isSameSchool(schoolId);
            allow create: if isStaff() &&
              request.resource.data.schoolId == schoolId && isSameSchool(schoolId);
            allow update: if isStaff() && isSameSchool(schoolId) &&
              request.resource.data.schoolId == schoolId;
          }
          match /structure_curriculum_assignments/{id} {
            allow read, delete: if isStaff() && isSameSchool(resource.data.schoolId);
            allow create: if isStaff() && isSameSchool(request.resource.data.schoolId);
            allow update: if isStaff() && isSameSchool(resource.data.schoolId) &&
              request.resource.data.schoolId == resource.data.schoolId;
          }
          match /structure_teaching_assignments/{id} {
            allow read, delete: if isStaff() && isSameSchool(resource.data.schoolId);
            allow create: if isStaff() && isSameSchool(request.resource.data.schoolId);
            allow update: if isStaff() && isSameSchool(resource.data.schoolId) &&
              request.resource.data.schoolId == resource.data.schoolId;
          }
          match /structure_class_timetables/{id} {
            allow read, delete: if isStaff() && isSameSchool(resource.data.schoolId);
            allow create: if isStaff() && isSameSchool(request.resource.data.schoolId);
            allow update: if isStaff() && isSameSchool(resource.data.schoolId) &&
              request.resource.data.schoolId == resource.data.schoolId;
          }
          match /structure_timetable_lessons/{id} {
            allow read, delete: if isStaff() && isSameSchool(resource.data.schoolId);
            allow create: if isStaff() && isSameSchool(request.resource.data.schoolId);
            allow update: if isStaff() && isSameSchool(resource.data.schoolId) &&
              request.resource.data.schoolId == resource.data.schoolId;
          }'''
          # YAML removes the block scalar indentation; normalize only the
          # indentation intentionally present inside the Python triple string.
          hardened = '\n'.join(line[10:] if line.startswith('          ') else line for line in hardened.splitlines())
          path.write_text(text[:start] + hardened + text[end:])
      - name: Commit hardened rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules
          git diff --cached --check
          git commit -m 'security(structure): keep tenant ownership immutable'
          git push origin HEAD:feat/structure-sequential-rebuild-2026-08-17
