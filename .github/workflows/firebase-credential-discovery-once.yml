name: Firebase Credential Discovery Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-credential-discovery-once.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: List Firebase/GCP-related secret names only
        shell: python
        run: |
          import json, os
          data = json.loads(os.environ.get('ALL_SECRETS_JSON') or '{}')
          candidates = []
          for key in sorted(data):
              upper = key.upper()
              if any(word in upper for word in ('FIREBASE', 'GOOGLE', 'GCP', 'GCLOUD')):
                  candidates.append(key)
          if candidates:
              print('Matching secret names:')
              for key in candidates:
                  print(f'- {key}')
          else:
              print('No Firebase/GCP-related repository or organization secret names are available to this workflow.')
