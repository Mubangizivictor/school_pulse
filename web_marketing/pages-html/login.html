<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — School Pulse</title>
<meta name="description" content="Sign in to School Pulse — for school staff, parents and students.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .signin-header {
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .signin-header .nav-wrap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    max-width: 100%;
  }
  .signin-help {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 14.5px; font-weight: 600; color: var(--color-ink-soft);
    min-height: 44px; padding: 0 4px;
  }
  .signin-help:hover { color: var(--color-primary); }
  .signin-help svg { width: 18px; height: 18px; }

  .signin-main { flex: 1; display: flex; align-items: center; padding: 40px 24px; min-width: 0; }
  .signin-container { max-width: 900px; margin: 0 auto; width: 100%; min-width: 0; }

  .signin-intro { text-align: center; margin-bottom: 32px; }
  .signin-mark {
    width: 48px; height: 48px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-lg);
    background: var(--color-primary-soft); color: var(--color-primary);
  }
  .signin-mark svg { width: 24px; height: 24px; }
  .signin-intro h1 { font-size: 28px; line-height: 1.15; margin: 0; }

  .role-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    min-width: 0;
  }
  .role-grid > * { min-width: 0; }
  .role-card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 24px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    min-width: 0; width: 100%; box-sizing: border-box;
  }
  .role-card p { max-width: 100%; }
  .role-card .card-icon { margin: 0 auto 14px; width: 44px; height: 44px; }
  .role-card .card-icon svg { width: 22px; height: 22px; }
  .role-card h3 { font-size: 17px; margin: 0 0 6px; }
  .role-card p { font-size: 14px; color: var(--color-muted); margin: 0 0 20px; line-height: 1.45; }
  .role-card .btn { margin-top: auto; }

  @media (max-width: 900px) {
    .role-grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
  }
  @media (max-width: 640px) {
    .signin-header .nav-wrap { padding: 12px 16px; }
    .signin-main { padding: 24px 16px; }
    .signin-intro { margin-bottom: 24px; }
    .signin-intro h1 { font-size: 24px; }
    .signin-mark { width: 40px; height: 40px; margin-bottom: 12px; }
    .signin-mark svg { width: 20px; height: 20px; }
    .role-card { padding: 18px; }
  }
</style>
</head>
<body>

<header class="signin-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <img class="logo-light" src="brand/logo_mark_light.svg" alt="" width="37" height="28">
        <img class="logo-dark" src="brand/logo_mark_dark.svg" alt="" width="37" height="28">
      </span>
      School Pulse
    </a>
    <a href="contact.html" class="signin-help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><path d="M12 17h.01"/></svg>
      Help
    </a>
  </div>
</header>

<main class="signin-main">
  <div class="signin-container">
    <div class="signin-intro">
      <div class="signin-mark" id="icon-brand"></div>
      <h1>Sign in to School Pulse.</h1>
    </div>

    <div class="role-grid">
      <div class="role-card">
        <div class="card-icon" id="icon-staff"></div>
        <h3>School staff</h3>
        <p>Access tools and resources to manage your school.</p>
        <a href="/app/staff/login" class="btn btn-primary btn-block">Sign in</a>
      </div>

      <div class="role-card">
        <div class="card-icon" id="icon-parent"></div>
        <h3>Parents</h3>
        <p>Stay informed and connected with your child's school.</p>
        <a href="/app/parent/login/child-id" class="btn btn-primary btn-block">Sign in</a>
      </div>

      <div class="role-card">
        <div class="card-icon" id="icon-student"></div>
        <h3>Students</h3>
        <p>Access your classes, assignments and school updates.</p>
        <a href="/app/student/login" class="btn btn-primary btn-block">Sign in</a>
      </div>
    </div>
  </div>
</main>

<script src="js/icons.js"></script>
<script>
  document.getElementById('icon-brand').innerHTML = window.ICONS.pulse || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2 8 4-16 2 8h6"/></svg>';
  document.getElementById('icon-staff').innerHTML = window.ICONS.operations;
  document.getElementById('icon-parent').innerHTML = window.ICONS.parents;
  document.getElementById('icon-student').innerHTML = window.ICONS.students;
</script>
</body>
</html>
