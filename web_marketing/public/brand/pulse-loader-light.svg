<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 8 92 70">
  <!-- Animated School Pulse loader: same mark as logo_mark_*.svg, animated
       like assets/branding/loading_*.gif (faint track, travelling pulse,
       swelling dot). Timing matches the app's AnimatedPulseMark. -->
  <style>
    .l{fill:none;stroke:#1F4FD1;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    .t{opacity:.2}
    .r{stroke-dasharray:412 1600;stroke-dashoffset:440;animation:r .96s linear infinite}
    .d{fill:#D4A017;transform-box:fill-box;transform-origin:center;animation:d .96s linear infinite}
    @keyframes r{from{stroke-dashoffset:440}to{stroke-dashoffset:-1030}}
    @keyframes d{0%,50%,100%{transform:scale(1)}25%{transform:scale(1.2)}}
    @media (prefers-reduced-motion:reduce){.r{display:none}.t{opacity:1}.d{animation:none}}
  </style>
  <path class="l t" d="M12 62 H27 L33 70 L50 33 L67 62 H88"/>
  <path class="l r" pathLength="1000" d="M12 62 H27 L33 70 L50 33 L67 62 H88"/>
  <circle class="d" cx="50" cy="19" r="6.5"/>
</svg>
